services:
  atlasmd-docs:
    image: ghcr.io/joaomcarlos/atlasmd:latest
    restart: on-failure
    ports:
      - 47145:47145
      - 47146:4000
    environment:
      - PORT=47145
    volumes:
      - ./content:/app/content
      - ./public:/app/public
      - ./config.toml:/app/config.toml
    develop:
      watch:
        - action: sync
          path: ./content
          target: /app/content
        - action: sync
          path: ./public
          target: /app/public
        - action: sync+restart
          path: ./config.toml
          target: /app/config.toml
