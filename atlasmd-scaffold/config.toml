# AtlasMD configuration.
# Mount this file into the container at /app/config.toml.
# Every consumer-configurable setting lives here — no ATLAS_* env vars needed.
# Only CI/build-driven values stay as env vars: CI_PAGES_URL (GitLab CI),
# APP_VERSION (build arg), PORT.

title = "AtlasMD"

