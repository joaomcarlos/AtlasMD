name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "atlasmd-renderer/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlasmd

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./atlasmd-renderer
          file: ./atlasmd-renderer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Best-effort: flip the package to public. May 404 on the very first
      # publish (package does not exist yet) or if the token lacks scope.
      # Fallback: set it manually once at
      # https://github.com/users/${{ github.repository_owner }}/packages/container/atlasmd/settings
      - name: Set package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/atlasmd \
            --field visibility=public \
            -H "Accept: application/vnd.github+json" || true
          echo "::warning::If the step above failed, set visibility to public manually at https://github.com/users/${{ github.repository_owner }}/packages/container/atlasmd/settings"
